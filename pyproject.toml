[project]
name = "transito-rn"
version = "0.1.0"
description = "Medição de congestionamento viário no Rio Grande do Norte, com série temporal própria e dados abertos de sinistros"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "typer>=0.15",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "tzdata>=2024.2; platform_system == 'Windows'",
    "matplotlib>=3.9",
    "folium>=0.19",
]

[project.scripts]
transito = "transito_rn.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transito_rn"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "C4", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/duplos.py" = ["ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
